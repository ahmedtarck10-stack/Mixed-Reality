name: Android CI - Full APK Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build Full Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding signing keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64 from repository..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating build keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-apks
          cp app/build/outputs/apk/debug/*.apk build-apks/
          cp app/build/outputs/apk/release/*.apk build-apks/
          echo "Built APK files:"
          ls -lh build-apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mixed-reality-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mixed-reality-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Full APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: mixed-reality-all-apks
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
