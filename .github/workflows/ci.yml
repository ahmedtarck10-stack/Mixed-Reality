name: Android CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding signing keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64 from repository..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating build keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Release Lint
        continue-on-error: true
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Build Release APK & Google Play Console AAB (Primary)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect Release Artifacts
        run: |
          mkdir -p release-artifacts
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          aab=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::Missing Release APK ($apk) or Release AAB ($aab)"
            exit 1
          fi
          cp "$apk" release-artifacts/mixed-reality-release.apk
          cp "$aab" release-artifacts/mixed-reality-release.aab
          echo "Built Release Artifacts:"
          ls -lh release-artifacts/

      - name: Upload Release APK (Primary)
        uses: actions/upload-artifact@v4
        with:
          name: mixed-reality-release-apk
          path: release-artifacts/mixed-reality-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Console Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: mixed-reality-play-console-aab
          path: release-artifacts/mixed-reality-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach Release APK & Play Console AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/mixed-reality-release.apk
            release-artifacts/mixed-reality-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
